<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elmulator</title>
    <script defer src="js/elm-canvas.js"></script>
    <script src="js/elmulator.js"></script>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>

        Source: <a href="https://github.com/SamuelBucheliZ/elmulator">github.com/SamuelBucheliZ/elmulator</a>.
        Forked from <a href="https://github.com/lakermann/elmulator">github.com/lakermann/elmulator</a>
        (published at <a href="https://lakermann.github.io/elmulator">lakermann.github.io/elmulator</a>).
    </footer>
    <script>
    var app = Elm.Main.init({
      node: document.getElementById('elm')
    });
    </script>
</body>
